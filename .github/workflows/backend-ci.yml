name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_app
          POSTGRES_USER: chat_app
          POSTGRES_PASSWORD: chat_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_app -d chat_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/chat_app
      POSTGRES_USER: chat_app
      POSTGRES_PASSWORD: chat_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test
