spring.application.name=backend

# Database settings are supplied through the environment. Do not add credentials here.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes are managed by Flyway migrations.
spring.jpa.hibernate.ddl-auto=none

# CORS is restricted to the configured frontend origin.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Supply a random secret of at least 32 bytes outside source control.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
